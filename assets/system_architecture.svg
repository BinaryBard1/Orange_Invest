<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="background:#ffffff; font-family:'Virgil', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b91c1c"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">Orange Invest Errands Agent • System Architecture</text>
  <text x="40" y="66" font-size="13" font-weight="500" fill="#64748b">End-to-End Execution Flow • Deterministic State Machine &amp; Code Approval Barrier</text>

  <!-- 1. User Input Box -->
  <g filter="url(#shadow)">
    <rect x="40" y="100" width="190" height="90" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
    <text x="135" y="135" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">User Request</text>
    <text x="135" y="155" font-size="11.5" fill="#475569" text-anchor="middle">"Find a plumber mornings</text>
    <text x="135" y="171" font-size="11.5" fill="#475569" text-anchor="middle">this week under ₹1,500"</text>
  </g>

  <!-- Arrow to Parser -->
  <path d="M 230 145 L 290 145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Intent & Slot Extractor -->
  <g filter="url(#shadow)">
    <rect x="295" y="100" width="200" height="90" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="395" y="132" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">NLU &amp; Parser Driver</text>
    <text x="395" y="152" font-size="11" fill="#0f172a" text-anchor="middle">Extracts: intent, service,</text>
    <text x="395" y="168" font-size="11" fill="#0f172a" text-anchor="middle">area, time_window, budget</text>
  </g>

  <!-- Arrow to Workflow State Machine -->
  <path d="M 495 145 L 555 145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Explicit Workflow State Machine -->
  <g filter="url(#shadow)">
    <rect x="560" y="85" width="360" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="740" y="112" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Explicit Workflow State Machine</text>
    <rect x="580" y="125" width="95" height="28" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="627" y="144" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">COLLECTING</text>
    
    <text x="687" y="143" font-size="12" fill="#d97706">❯</text>

    <rect x="702" y="125" width="95" height="28" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="749" y="144" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">SEARCHING</text>

    <text x="807" y="143" font-size="12" fill="#d97706">❯</text>

    <rect x="820" y="125" width="85" height="28" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="862" y="144" font-size="11" font-weight="600" fill="#92400e" text-anchor="middle">HOLDING</text>
    <text x="740" y="185" font-size="11" fill="#78350f" text-anchor="middle">✓ Asks ONLY for missing slots  •  Partial corrections keep all else</text>
  </g>

  <!-- Arrow down to Search / Hold tool -->
  <path d="M 740 205 L 740 255" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Provider Catalog & Hold -->
  <g filter="url(#shadow)">
    <rect x="635" y="260" width="210" height="75" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="740" y="288" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Search &amp; Hold Slot</text>
    <text x="740" y="306" font-size="11" fill="#475569" text-anchor="middle">search_providers() • hold_slot()</text>
    <text x="740" y="322" font-size="10.5" fill="#64748b" text-anchor="middle">Acquires 10-minute hold</text>
  </g>

  <!-- Arrow to Approval Guard -->
  <path d="M 635 297 L 530 297" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. THE HARD BARRIER: Code-Enforced Approval Guard -->
  <g filter="url(#shadow)">
    <rect x="235" y="240" width="290" height="115" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="380" y="268" font-size="14.5" font-weight="700" fill="#991b1b" text-anchor="middle">🛡️ Code Approval Barrier</text>
    <text x="380" y="288" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">verify_and_consume(action, prov, slot, price)</text>
    <text x="380" y="308" font-size="11" fill="#7f1d1d" text-anchor="middle">Record checked by code, NEVER model text</text>
    <text x="380" y="326" font-size="10.5" fill="#991b1b" text-anchor="middle">Any price or slot change immediately VOIDS</text>
    <text x="380" y="342" font-size="10.5" fill="#991b1b" text-anchor="middle">Neutralizes all prompt injections in reviews</text>
  </g>

  <!-- Arrow to Execution Gateway -->
  <path d="M 380 355 L 380 405" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="395" y="385" font-size="11" font-weight="700" fill="#15803d">USER "YES"</text>

  <!-- 6. Verified Execution & Authoritative Truth -->
  <g filter="url(#shadow)">
    <rect x="235" y="410" width="290" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="438" font-size="14" font-weight="700" fill="#166534" text-anchor="middle">Verified Execution Gateway</text>
    <text x="380" y="458" font-size="11" fill="#14532d" text-anchor="middle">book(hold_id, idempotency_key)</text>
    <text x="380" y="476" font-size="11" font-weight="600" fill="#15803d" text-anchor="middle">On Timeout: get_booking_status() check</text>
    <text x="380" y="494" font-size="10.5" fill="#166534" text-anchor="middle">Authoritative verification before claiming success</text>
    <text x="380" y="509" font-size="10.5" fill="#166534" text-anchor="middle">No duplicate bookings across retries or restarts</text>
  </g>

  <!-- 7. Memory Sidecar -->
  <g filter="url(#shadow)">
    <rect x="40" y="240" width="165" height="115" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
    <text x="122" y="268" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">Memory Store</text>
    <text x="122" y="288" font-size="10.5" font-weight="600" fill="#581c87" text-anchor="middle">• STATED (auto-used)</text>
    <text x="122" y="304" font-size="10.5" font-weight="600" fill="#581c87" text-anchor="middle">• INFERRED (needs ok)</text>
    <text x="122" y="320" font-size="10.5" font-weight="600" fill="#581c87" text-anchor="middle">• TOMBSTONED (forgotten)</text>
    <text x="122" y="340" font-size="10" fill="#7e22ce" text-anchor="middle">Never resurrects</text>
  </g>
  <path d="M 122 190 L 122 235" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- 8. Observability & Tracer -->
  <g filter="url(#shadow)">
    <rect x="40" y="410" width="165" height="110" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="122" y="438" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Structured Tracer</text>
    <text x="122" y="458" font-size="10.5" fill="#475569" text-anchor="middle">• State transitions</text>
    <text x="122" y="474" font-size="10.5" fill="#475569" text-anchor="middle">• Invariant checks</text>
    <text x="122" y="490" font-size="10.5" fill="#475569" text-anchor="middle">• Latency, tokens, cost</text>
    <text x="122" y="506" font-size="10.5" fill="#475569" text-anchor="middle">• Redacts all secrets</text>
  </g>
  <path d="M 235 465 L 210 465" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 9. Proactive Follow-Up (Nice to have) -->
  <g filter="url(#shadow)">
    <rect x="635" y="410" width="285" height="110" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="777" y="438" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">Proactive Follow-Up Handler</text>
    <text x="777" y="458" font-size="11" fill="#c2410c" text-anchor="middle">Provider cancellation event received</text>
    <text x="777" y="474" font-size="11" fill="#7c2d12" text-anchor="middle">Auto-searches &amp; holds alternative</text>
    <text x="777" y="494" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">REQUIRES user approval to rebook</text>
  </g>
  <path d="M 525 465 L 630 465" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
</svg>

