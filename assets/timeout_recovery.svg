<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="100%" height="100%" style="background:#ffffff; font-family:'Virgil', 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <filter id="sh2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">Timeout-After-Success Recovery &amp; Idempotency</text>
  <text x="40" y="60" font-size="12.5" fill="#64748b">Authoritative Source of Truth Protocol &amp; Idempotency</text>

  <!-- Lifeline Entities -->
  <!-- Entity 1: Chat Agent -->
  <g filter="url(#sh2)">
    <rect x="70" y="90" width="160" height="45" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="150" y="118" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Chat Agent</text>
  </g>
  <line x1="150" y1="135" x2="150" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Entity 2: Provider API Gateway -->
  <g filter="url(#sh2)">
    <rect x="390" y="90" width="160" height="45" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="470" y="118" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Provider API</text>
  </g>
  <line x1="470" y1="135" x2="470" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Entity 3: Backend DB / Truth -->
  <g filter="url(#sh2)">
    <rect x="710" y="90" width="160" height="45" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="790" y="118" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">Authoritative DB</text>
  </g>
  <line x1="790" y1="135" x2="790" y2="440" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Step 1: book(hold_id, idempotency_key) -->
  <path d="M 150 170 L 465 170" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="310" y="162" font-size="11.5" font-weight="600" fill="#0369a1" text-anchor="middle">1. book(hold_id, idempotency_key)</text>

  <!-- Step 2: Commits to DB -->
  <path d="M 470 190 L 785 190" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="630" y="182" font-size="11" fill="#15803d" text-anchor="middle">2. Booking committed (b_xxx)</text>

  <!-- Step 3: Network Timeout Drop -->
  <path d="M 470 230 L 250 230" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="330" y="222" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">✖ Upstream Network Timeout (5000ms)</text>
  <polygon points="245,225 245,235 235,230" fill="#dc2626"/>

  <!-- Agent Interception Note -->
  <rect x="50" y="255" width="200" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="275" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">DO NOT RE-BOOK!</text>
  <text x="150" y="293" font-size="10" fill="#7f1d1d" text-anchor="middle">Prevents double booking!</text>

  <!-- Step 4: Authoritative Status Check -->
  <path d="M 150 330 L 785 330" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="470" y="322" font-size="11.5" font-weight="700" fill="#6d28d9" text-anchor="middle">3. get_booking_status(idempotency_key)</text>

  <!-- Step 5: Truth returned -->
  <path d="M 790 370 L 155 370" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="470" y="362" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">4. status: "booked", booking_id: "b_xxx"</text>

  <!-- Step 6: Verified success -->
  <rect x="50" y="395" width="200" height="42" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="150" y="413" font-size="10.5" font-weight="700" fill="#14532d" text-anchor="middle">VERIFIED CONFIRMATION</text>
  <text x="150" y="427" font-size="10" fill="#166534" text-anchor="middle">Success reported to user safely</text>
</svg>

